<!DOCTYPE html>
<html>
<head>
    <title>My Battle Game</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial;
            background: black;
        }

        #info {
            position: fixed;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            z-index: 10;
        }
    </style>
</head>

<body>

<div id="info">
    🏝️ MY BATTLE GAME<br>
    WASD = Move | Mouse = Look
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene, camera, renderer;
let player;

let keys = {};

let speed = 0.15;

let mouseX = 0;
let mouseY = 0;

init();
animate();

function init() {

    // SCENE
    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x87ceeb);

    // CAMERA
    camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    camera.position.set(0, 2, 6);

    // LIGHT
    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(10, 20, 10);
    scene.add(light);

    const ambient = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambient);

    // GROUND
    const groundGeometry =
        new THREE.BoxGeometry(100, 1, 100);

    const groundMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x3c8c40
        });

    const ground =
        new THREE.Mesh(
            groundGeometry,
            groundMaterial
        );

    ground.position.y = -0.5;

    scene.add(ground);

    // PLAYER
    const playerGeometry =
        new THREE.BoxGeometry(1, 2, 1);

    const playerMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x0066ff
        });

    player =
        new THREE.Mesh(
            playerGeometry,
            playerMaterial
        );

    player.position.y = 1;

    scene.add(player);

    // RENDERER
    renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    document.body.appendChild(
        renderer.domElement
    );

    // KEYBOARD
    document.addEventListener(
        "keydown",
        function(event) {
            keys[event.key.toLowerCase()] = true;
        }
    );

    document.addEventListener(
        "keyup",
        function(event) {
            keys[event.key.toLowerCase()] = false;
        }
    );

    // MOUSE
    document.addEventListener(
        "mousemove",
        function(event) {

            mouseX -= event.movementX * 0.002;
            mouseY -= event.movementY * 0.002;

            mouseY = Math.max(
                -1.2,
                Math.min(1.2, mouseY)
            );
        }
    );

    // CLICK TO LOCK MOUSE
    document.addEventListener(
        "click",
        function() {
            document.body.requestPointerLock();
        }
    );

    // WINDOW RESIZE
    window.addEventListener(
        "resize",
        function() {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        }
    );
}


function animate() {

    requestAnimationFrame(animate);

    // MOVEMENT

    if (keys["w"]) {
        player.position.z -= speed;
    }

    if (keys["s"]) {
        player.position.z += speed;
    }

    if (keys["a"]) {
        player.position.x -= speed;
    }

    if (keys["d"]) {
        player.position.x += speed;
    }

    // CAMERA FOLLOW PLAYER

    camera.position.x =
        player.position.x;

    camera.position.z =
        player.position.z + 6;

    camera.position.y = 2.5;

    camera.lookAt(
        player.position.x,
        player.position.y,
        player.position.z
    );

    renderer.render(
        scene,
        camera
    );
}

</script>

</body>
</html>
