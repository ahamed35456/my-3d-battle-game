<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Battle Game - Lobby</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            font-family: Arial, sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    #29445c,
                    #101722 65%
                );

        }


        .lobby {

            width: 100%;

            height: 100%;

            position: relative;

            display: flex;

            flex-direction: column;

        }


        /* TOP BAR */

        .topbar {

            height: 70px;

            background:
                rgba(0,0,0,0.55);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 22px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.12);

        }


        .logo {

            font-size: 23px;

            font-weight: bold;

        }


        .profile {

            text-align: right;

            font-size: 14px;

        }


        .profile strong {

            font-size: 16px;

        }


        /* CENTER */

        .center {

            flex: 1;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        /* CHARACTER */

        .character-area {

            text-align: center;

        }


        .character {

            width: 120px;

            height: 210px;

            position: relative;

            margin: auto;

        }


        .head {

            width: 58px;

            height: 58px;

            border-radius: 50%;

            background: #d89b72;

            position: absolute;

            left: 31px;

            top: 5px;

        }


        .body {

            width: 72px;

            height: 95px;

            border-radius: 12px;

            background: #2874a6;

            position: absolute;

            left: 24px;

            top: 60px;

        }


        .arm {

            width: 18px;

            height: 72px;

            background: #d89b72;

            position: absolute;

            top: 68px;

            border-radius: 10px;

        }


        .arm.left {

            left: 7px;

            transform:
                rotate(10deg);

        }


        .arm.right {

            right: 7px;

            transform:
                rotate(-10deg);

        }


        .leg {

            width: 24px;

            height: 70px;

            background: #222;

            position: absolute;

            top: 148px;

            border-radius: 8px;

        }


        .leg.left {

            left: 30px;

        }


        .leg.right {

            right: 30px;

        }


        .player-name {

            margin-top: 5px;

            font-size: 20px;

            font-weight: bold;

        }


        .level {

            color: #ffd166;

            margin-top: 5px;

        }


        /* MODES */

        .modes {

            position: absolute;

            left: 20px;

            top: 25px;

            width: 230px;

        }


        .modes h2 {

            margin:
                0 0 12px;

            font-size: 18px;

        }


        .mode-button {

            width: 100%;

            padding: 12px;

            margin: 5px 0;

            border: 0;

            border-radius: 9px;

            background:
                rgba(20,28,40,0.9);

            color: white;

            text-align: left;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

        }


        .mode-button:hover {

            background:
                #31536e;

        }


        .mode-button.selected {

            background:
                #e86f00;

        }


        /* SIDE */

        .side-menu {

            position: absolute;

            right: 20px;

            top: 25px;

            width: 190px;

        }


        .side-button {

            width: 100%;

            padding: 13px;

            margin: 6px 0;

            border: 0;

            border-radius: 9px;

            background:
                rgba(20,28,40,0.9);

            color: white;

            font-weight: bold;

            cursor: pointer;

        }


        .side-button:hover {

            background:
                #31536e;

        }


        /* START */

        .start-area {

            position: absolute;

            bottom: 25px;

            left: 50%;

            transform:
                translateX(-50%);

            text-align: center;

        }


        #selectedMode {

            margin-bottom: 8px;

            color: #ffd166;

            font-weight: bold;

        }


        #startButton {

            width: 280px;

            padding: 17px;

            border: 0;

            border-radius: 12px;

            background:
                #ff7a00;

            color: white;

            font-size: 20px;

            font-weight: bold;

            cursor: pointer;

        }


        #startButton:hover {

            background:
                #ff922b;

        }


        /* PANELS */

        .panel {

            display: none;

            position: absolute;

            z-index: 20;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            width: 90%;

            max-width: 520px;

            max-height: 80%;

            overflow: auto;

            padding: 25px;

            border-radius: 15px;

            background: #17202b;

            box-shadow:
                0 10px 40px
                rgba(0,0,0,0.7);

        }


        .panel h2 {

            margin-top: 0;

        }


        .close {

            float: right;

            border: 0;

            background: #333;

            color: white;

            border-radius: 6px;

            padding: 7px 12px;

            cursor: pointer;

        }


        /* FRIEND INPUT */

        .friend-input {

            display: flex;

            gap: 8px;

            margin: 15px 0;

        }


        .friend-input input {

            flex: 1;

            padding: 12px;

            border: 0;

            border-radius: 7px;

            font-size: 15px;

        }


        .friend-input button {

            padding: 12px 15px;

            border: 0;

            border-radius: 7px;

            background: #e86f00;

            color: white;

            font-weight: bold;

            cursor: pointer;

        }


        .friend {

            padding: 12px;

            margin: 7px 0;

            background: #222e3b;

            border-radius: 8px;

        }


        .online {

            color: #52e38b;

            font-weight: bold;

        }


        .offline {

            color: #999;

        }


        .request {

            padding: 12px;

            margin: 7px 0;

            background: #26384a;

            border-radius: 8px;

        }


        .request button {

            border: 0;

            border-radius: 6px;

            padding: 7px 10px;

            margin-right: 5px;

            cursor: pointer;

            color: white;

        }


        .accept {

            background: #219653;

        }


        .reject {

            background: #b83232;

        }


        #friendMessage {

            color: #ffd166;

            min-height: 20px;

        }


        /* EMOTES */

        .emote {

            display: inline-block;

            width: 45%;

            margin: 5px;

            padding: 14px;

            background: #26384a;

            border: 0;

            border-radius: 8px;

            color: white;

            cursor: pointer;

        }


        .emote:hover {

            background: #3c5870;

        }


        @media(max-width: 700px) {

            .modes {

                width: 170px;

                left: 8px;

                top: 12px;

            }


            .side-menu {

                width: 140px;

                right: 8px;

                top: 12px;

            }


            .mode-button,
            .side-button {

                padding: 9px;

                font-size: 12px;

            }


            .character {

                transform:
                    scale(0.8);

            }


            #startButton {

                width: 230px;

            }

        }

    </style>

</head>


<body>


<div class="lobby">


    <!-- TOP -->

    <div class="topbar">

        <div class="logo">
            🎮 MY BATTLE GAME
        </div>


        <div class="profile">

            <strong id="username">
                Player
            </strong>

            <br>

            UID:
            <span id="uid">
                11111111
            </span>

        </div>

    </div>


    <!-- CENTER -->

    <div class="center">


        <!-- MODES -->

        <div class="modes">

            <h2>
                GAME MODES
            </h2>


            <button
                class="mode-button selected"
                onclick="selectMode('Battle Royale', this)">

                🎮 Battle Royale

            </button>


            <button
                class="mode-button"
                onclick="selectMode('BR Ranked', this)">

                🏆 BR Ranked

            </button>


            <button
                class="mode-button"
                onclick="selectMode('Clash Squad', this)">

                ⚔️ Clash Squad

            </button>


            <button
                class="mode-button"
                onclick="selectMode('CS Ranked', this)">

                🏆 CS Ranked

            </button>


            <button
                class="mode-button"
                onclick="selectMode('Lone Wolf', this)">

                🐺 Lone Wolf

            </button>

        </div>


        <!-- CHARACTER -->

        <div class="character-area">

            <div class="character">

                <div class="head"></div>

                <div class="body"></div>

                <div class="arm left"></div>

                <div class="arm right"></div>

                <div class="leg left"></div>

                <div class="leg right"></div>

            </div>


            <div
                class="player-name"
                id="playerName">

                Player

            </div>


            <div class="level">

                ⭐ Level 1
                &nbsp; | &nbsp;
                XP 0/100

            </div>

        </div>


        <!-- SIDE -->

        <div class="side-menu">

            <button
                class="side-button"
                onclick="openFriends()">

                👥 Friends

            </button>


            <button
                class="side-button"
                onclick="openPanel('emotesPanel')">

                🕺 Emotes

            </button>


            <button
                class="side-button"
                onclick="showRank()">

                🏆 Rank

            </button>

        </div>


        <!-- START -->

        <div class="start-area">

            <div id="selectedMode">

                Selected: Battle Royale

            </div>


            <button
                id="startButton"
                onclick="startGame()">

                START

            </button>

        </div>

    </div>


    <!-- FRIENDS PANEL -->

    <div
        id="friendsPanel"
        class="panel">


        <button
            class="close"
            onclick="closePanel('friendsPanel')">

            ✕

        </button>


        <h2>
            👥 Friends
        </h2>


        <!-- ADD FRIEND -->

        <div class="friend-input">

            <input
                id="friendUID"
                type="text"
                inputmode="numeric"
                placeholder="Enter friend's UID">


            <button
                onclick="addFriend()">

                ADD

            </button>

        </div>


        <div id="friendMessage"></div>


        <!-- REQUESTS -->

        <h3>
            📩 Friend Requests
        </h3>


        <div id="requests">

            <div class="friend">
                No pending requests.
            </div>

        </div>


        <!-- FRIEND LIST -->

        <h3>
            👥 My Friends
        </h3>


        <div id="friends">

            <div class="friend">
                No friends yet.
            </div>

        </div>


        <button
            onclick="refreshFriends()"
            style="
                width:100%;
                padding:10px;
                border:0;
                border-radius:7px;
                background:#31536e;
                color:white;
                cursor:pointer;
            ">

            🔄 Refresh

        </button>


    </div>


    <!-- EMOTES -->

    <div
        id="emotesPanel"
        class="panel">


        <button
            class="close"
            onclick="closePanel('emotesPanel')">

            ✕

        </button>


        <h2>
            🕺 Emotes
        </h2>


        <button
            class="emote"
            onclick="useEmote('👋 Wave')">

            👋 Wave

        </button>


        <button
            class="emote"
            onclick="useEmote('😂 Laugh')">

            😂 Laugh

        </button>


        <button
            class="emote"
            onclick="useEmote('👍 Like')">

            👍 Like

        </button>


        <button
            class="emote"
            onclick="useEmote('🎉 Celebrate')">

            🎉 Celebrate

        </button>

    </div>


</div>


<!-- SOCKET.IO -->

<script src="/socket.io/socket.io.js"></script>


<script>


/* =========================
   LOGIN DATA
========================= */

const username =
    localStorage.getItem("username")
    || "Player";


const uid =
    localStorage.getItem("uid")
    || "11111111";


document.getElementById(
    "username"
).textContent =
    username;


document.getElementById(
    "uid"
).textContent =
    uid;


document.getElementById(
    "playerName"
).textContent =
    username;


/* =========================
   SOCKET
========================= */

const socket = io();


socket.on("connect", () => {

    console.log(
        "Connected to server."
    );


    socket.emit(
        "joinGame",
        {
            uid: uid,
            username: username
        }
    );

});


/* =========================
   FRIENDS
========================= */

function openFriends() {

    openPanel(
        "friendsPanel"
    );


    refreshFriends();

    refreshRequests();

}


function addFriend() {

    const input =
        document.getElementById(
            "friendUID"
        );


    const friendUID =
        input.value.trim();


    if (!friendUID) {

        showFriendMessage(
            "Enter a UID."
        );

        return;

    }


    socket.emit(
        "addFriend",
        {
            uid: friendUID
        }
    );


    input.value = "";

}


function refreshFriends() {

    socket.emit(
        "getFriends"
    );

}


function refreshRequests() {

    socket.emit(
        "getFriendRequests"
    );

}


function acceptFriend(uid) {

    socket.emit(
        "acceptFriend",
        {
            uid: uid
        }
    );

}


function rejectFriend(uid) {

    socket.emit(
        "rejectFriend",
        {
            uid: uid
        }
    );


    refreshRequests();

}


function showFriendMessage(message) {

    const box =
        document.getElementById(
            "friendMessage"
        );


    box.textContent =
        message;


    setTimeout(
        function() {

            box.textContent = "";

        },
        3500
    );

}


/* =========================
   FRIEND LIST
========================= */

socket.on(
    "friendList",
    function(friends) {

        const box =
            document.getElementById(
                "friends"
            );


        box.innerHTML = "";


        if (
            friends.length === 0
        ) {

            box.innerHTML =
                '<div class="friend">' +
                'No friends yet.' +
                '</div>';

            return;

        }


        friends.forEach(
            function(friend) {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "friend";


                const status =
                    friend.online
                        ? '<span class="online">🟢 Online</span>'
                        : '<span class="offline">⚫ Offline</span>';


                div.innerHTML =

                    "<strong>" +
                    friend.username +
                    "</strong><br>" +

                    "UID: " +
                    friend.uid +
                    "<br>" +

                    status;


                box.appendChild(
                    div
                );

            }
        );

    }
);


/* =========================
   FRIEND REQUESTS
========================= */

socket.on(
    "friendRequests",
    function(requests) {

        const box =
            document.getElementById(
                "requests"
            );


        box.innerHTML = "";


        if (
            requests.length === 0
        ) {

            box.innerHTML =
                '<div class="friend">' +
                'No pending requests.' +
                '</div>';

            return;

        }


        requests.forEach(
            function(request) {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "request";


                div.innerHTML =

                    "<strong>" +
                    request.username +
                    "</strong><br>" +

                    "UID: " +
                    request.uid +
                    "<br><br>" +

                    '<button class="accept" ' +
                    'onclick="acceptFriend(\'' +
                    request.uid +
                    '\')">' +
                    '✅ ACCEPT' +
                    '</button>' +

                    '<button class="reject" ' +
                    'onclick="rejectFriend(\'' +
                    request.uid +
                    '\')">' +
                    '❌ REJECT' +
                    '</button>';


                box.appendChild(
                    div
                );

            }
        );

    }
);


/* =========================
   FRIEND MESSAGES
========================= */

socket.on(
    "friendMessage",
    function(message) {

        showFriendMessage(
            message
        );


        refreshFriends();

        refreshRequests();

    }
);


/* =========================
   NEW REQUEST
========================= */

socket.on(
    "friendRequest",
    function(request) {

        showFriendMessage(
            "📩 Friend request from " +
            request.username +
            "!"
        );


        refreshRequests();

    }
);


/* =========================
   STATUS
========================= */

socket.on(
    "friendStatus",
    function() {

        refreshFriends();

    }
);


/* =========================
   MODE
========================= */

let selectedMode =
    "Battle Royale";


function selectMode(
    mode,
    button
) {

    selectedMode =
        mode;


    document
        .querySelectorAll(
            ".mode-button"
        )
        .forEach(
            function(btn) {

                btn.classList.remove(
                    "selected"
                );

            }
        );


    button.classList.add(
        "selected"
    );


    document.getElementById(
        "selectedMode"
    ).textContent =
        "Selected: " +
        mode;

}


/* =========================
   START
========================= */

function startGame() {

    alert(
        "Starting " +
        selectedMode +
        "...\n\n" +
        "The 3D match system will be connected next."
    );

}


/* =========================
   PANELS
========================= */

function openPanel(id) {

    document.getElementById(id)
        .style.display =
        "block";

}


function closePanel(id) {

    document.getElementById(id)
        .style.display =
        "none";

}


/* =========================
   EMOTES
========================= */

function useEmote(emote) {

    alert(
        username +
        " used " +
        emote +
        "!"
    );

}


/* =========================
   RANK
========================= */

function showRank() {

    alert(

        "🏆 Current Rank\n\n" +

        "Bronze I\n" +

        "Rank Points: 0"

    );

}


</script>


</body>

</html>
